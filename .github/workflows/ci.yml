name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/extension.test.mjs
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python -m unittest discover -s tests
      - run: python tools/search_demo.py
      - run: python tools/check_crawler_tls.py
      - run: python tools/build_search_app.py
        if: runner.os == 'macOS'
      - run: python tools/test_search_app.py
        if: runner.os == 'macOS'
      - run: python tools/test_browser_view.py
        if: runner.os == 'macOS'
  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/fetch_firefox_linux.py
      - run: python tools/browser_smoke.py --firefox .quill/ci-engine/firefox/firefox --require-extension
