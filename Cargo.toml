[workspace]
resolver = "2"
members = ["privacy", "search/common", "search/parser", "search/index", "search/ranking", "search/crawler", "search/query", "search/spam", "vault", "updater"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
